name: CI/CD

on:
  push:
    branches: [main, dev]

permissions:
  id-token: write
  contents: read

env:
  RUN_SONAR: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Build builder image
        run: docker build --target builder -t app:builder .

      - name: Build production image
        run: docker build --target production -t app:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: app:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - name: Run tests
        run: docker build --target test .

      - name: SonarCloud scan
        if: env.RUN_SONAR == 'true'
        uses: sonarsource/sonarqube-scan-action@v7.0.0
        with:
          projectBaseDir: .
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"


  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        working-directory: cdk
        run: pip install -r requirements.txt

      - name: Disable telemetry
        working-directory: cdk
        run: cdk cli-telemetry --disable

      - name: CDK bootstrap
        working-directory: cdk
        run: cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ vars.AWS_REGION }}

      - name: CDK synth
        working-directory: cdk
        run: cdk synth --app

      - name: CDK diff
        working-directory: cdk
        run: cdk diff

      - name: Deploy CDK
        working-directory: cdk
        run: cdk deploy --require-approval never
