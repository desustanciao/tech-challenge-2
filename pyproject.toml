[project]
name = "fastapi-aws-app"
version = "0.1.0"
description = "Production-grade FastAPI app deployed on AWS"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-jose>=3.3",
    "passlib[bcrypt]>=1.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.15",
    "mypy>=1.9",
    "pre-commit>=4.5",
]

[tool.ruff]
[tool.ruff]
# Maximum line length for code
line-length = 100
target-version = "py312"

# Enable commonly used rule sets
# E = pycodestyle (PEP8)
# F = pyflakes (unused variables, undefined names)
# I = isort (import order)
# B = bugbear (common bug patterns)
# UP = pyupgrade (modern syntax enforcement)
select = ["E", "F", "I", "B", "UP"]

# Ignore certain rules commonly overridden in open source
ignore = [
    "E501",  # line too long (handled by line-length)
]

# Formatting options
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# How imports are grouped
[tool.ruff.isort]
profile = "black"  # compatible with black formatting

[tool.pytest.ini_options]
asyncio_mode = "auto"
